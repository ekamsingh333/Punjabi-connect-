<style type="text/tailwindcss">
@layer components{
 .input{@apply min-h-[42px] w-full rounded-lg border border-black/15 bg-white px-3 py-2 text-sm transition outline-none focus:border-indigo focus:ring-2 focus:ring-indigo/20}

<body class="bg-white font-sans text-ink antialiased">
<header class="sticky top-0 z-30 border-b border-black/10 bg-white/95 backdrop-blur"><div id="nav"></div></header>
<main id="app" class="min-h-[70vh]"></main>
<footer class="mt-20 bg-ink text-white/70"><div class="mx-auto grid max-w-6xl gap-8 px-4 py-12 md:grid-cols-4"><div class="md:col-span-2"><p class="font-display text-xl font-bold text-white">Punjabi<span class="text-saffron">Connect</span></p><p class="mt-2 max-w-sm text-sm">Where Punjabi creators meet great brands. Stats on profiles are self-reported and not verified.</p></div><div class="space-y-2 text-sm"><p class="eyebrow">Explore</p><a class="block hover:text-white" href="#/creators">Creators</a><a class="block hover:text-white" href="#/campaigns">Campaigns</a><a class="block hover:text-white" href="#/how">How it works</a></div><div class="space-y-2 text-sm"><p class="eyebrow">Company</p><a class="block hover:text-white" href="#/about">About</a><a class="block hover:text-white" href="#/contact">Contact</a><a class="block hover:text-white" href="#/privacy">Privacy Policy</a><a class="block hover:text-white" href="#/terms">Terms</a></div></div><p class="border-t border-white/10 py-4 text-center text-xs">© Punjabi Connect</p>
</footer>
<div id="toasts" class="fixed bottom-4 left-1/2 z-50 w-[92vw] max-w-sm -translate-x-1/2 space-y-2 text-center"></div>

<script type="module">
/* ============ 1. PASTE YOUR FIREBASE CONFIG HERE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAIj_Qy-vEdFi3K8mWQsUSoSQK_Gn7VapM",
  authDomain: "punjabi-connect-9b0e8.firebaseapp.com",
  projectId: "punjabi-connect-9b0e8",
  storageBucket: "punjabi-connect-9b0e8.firebasestorage.app",
  messagingSenderId: "260391633509",
  appId: "1:260391633509:web:ef38e8dba729ca36de7c8c"
};
/* ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, updateProfile, deleteUser } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, collection, getDocs, query, where, serverTimestamp, writeBatch, getCountFromServer, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const E = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => "₹" + Number(n || 0).toLocaleString("en-IN");
const isUrl = s => { try { const u = new URL(s); return u.protocol === "https:" || u.protocol === "http:"; } catch { return false; } };
const fmtDate = d => { const x = new Date(d + "T00:00:00"); return isNaN(x) ? E(d) : x.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }); };
const expired = d => { const x = new Date(d + "T23:59:59"); return !isNaN(x) && x < new Date(); };
const href = u => isUrl(u) ? E(u) : "#";
const CATS = ["Comedy","Music","Vlogs","Food","Tech","Education","Fashion","Fitness","Travel","Gaming","Agriculture","Other"];
const LANGS = ["Punjabi","Hindi","English","Haryanvi","Other"];
const TYPES = ["YouTube video","YouTube Short","Instagram Reel","Instagram post","Instagram story"];

function toast(msg, ok = true) {
  const d = document.createElement("div");
  d.setAttribute("role", "status");
  d.className = `toast-in rounded-lg px-4 py-2 text-sm text-white shadow-lg ${ok ? "bg-leaf" : "bg-red-600"}`;
  d.textContent = msg; d.title = "Tap to dismiss"; d.onclick = () => d.remove(); d.classList.add("cursor-pointer"); $("#toasts").append(d); setTimeout(() => d.remove(), 3500);
}
const spin = () => `<div class="mx-auto max-w-6xl px-4 py-10"><div class="sk h-8 w-56 rounded-lg"></div><div class="sk mt-3 h-4 w-80 max-w-full rounded"></div><div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${[1,2,3].map(() => '<div class="sk h-32 rounded-xl"></div>').join("")}</div></div>`;
const empty = t => `<div class="card text-center text-sm text-ink/60">${t}</div>`;
const wrap = (h, w = "max-w-6xl") => `<div class="mx-auto ${w} px-4 py-10">${h}</div>`;
const badge = s => { const c = { pending: "bg-amber-100 text-amber-800", accepted: "bg-leaf/10 text-leaf", completed: "bg-leaf/10 text-leaf", rejected: "bg-red-50 text-red-600", suspended: "bg-red-50 text-red-600" }[s] || "bg-black/5"; return `<span class="rounded-full px-2 py-0.5 text-xs ${c}">${E(String(s).replace("_", " "))}</span>`; };
const opts = (a, sel, any) => (any ? `<option value="">${any}</option>` : "") + a.map(o => `<option ${o === sel ? "selected" : ""}>${o}</option>`).join("");
const fld = (l, n, v = "", t = "text", x = "") => `<label class="block text-sm"><span class="mb-1 block text-ink/70">${l}</span><input class="input" name="${n}" type="${t}" value="${E(v)}" ${x}></label>`;
const ta = (l, n, v = "", r = 3) => `<label class="block text-sm"><span class="mb-1 block text-ink/70">${l}</span><textarea class="input" name="${n}" rows="${r}">${E(v)}</textarea></label>`;
const sel = (l, n, a, v) => `<label class="block text-sm"><span class="mb-1 block text-ink/70">${l}</span><select class="input" name="${n}">${opts(a, v)}</select></label>`;
const tabs = (base, list, cur) => `<div class="mb-5 flex gap-2 overflow-x-auto">${list.map(t => `<a href="#${base}?tab=${t}" class="whitespace-nowrap rounded-lg px-3 py-1.5 text-sm capitalize ${t === cur ? "bg-indigo text-white" : "border border-black/10"}">${t}</a>`).join("")}</div>`;

/* ---------- setup screen if config missing ---------- */
if (firebaseConfig.apiKey.startsWith("PASTE")) {
  $("#app").innerHTML = wrap(`<div class="card"><h1 class="font-display text-2xl">One step left</h1><p class="mt-2 text-sm">Open this file in a text editor and paste your Firebase web config where it says <b>PASTE YOUR FIREBASE CONFIG HERE</b>, then upload it again.</p></div>`, "max-w-xl");
  throw new Error("Firebase config missing");
}
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const S = { busy: false, user: null, uid: null, role: null, admin: false, ready: false };
const rows = async (name, ...c) => (await getDocs(query(collection(db, name), ...c))).docs.map(d => ({ id: d.id, ...d.data() }));

/* ---------- navbar ---------- */
function nav() {
  const l = "text-sm text-ink/70 hover:text-ink";
  const links = `<a class="${l}" href="#/creators">Explore Creators</a><a class="${l}" href="#/campaigns">Brand Campaigns</a><a class="${l}" href="#/how">How It Works</a>`;
  const acct = S.user ? `<a class="${l}" href="#/dash">Dashboard</a>${S.admin ? `<a class="${l} font-medium !text-saffron" href="#/admin">Admin</a>` : ""}<button class="btn2" data-act="logout">Logout</button>` : `<a class="${l}" href="#/login">Login</a><a class="btn" href="#/signup">Sign Up</a>`;
  $("#nav").innerHTML = `<div class="phulkari"></div><nav aria-label="Main" class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-4 py-3">
   <a href="#/" class="font-display text-lg font-bold">Punjabi<span class="text-saffron">Connect</span></a>
   <div class="hidden items-center gap-6 md:flex">${links}</div>
   <div class="hidden items-center gap-3 md:flex">${acct}</div>
   <button class="btn2 md:!hidden" data-act="menu" aria-expanded="false" aria-controls="mm" aria-label="Open menu">Menu</button></nav>
   <div id="mm" class="menu flex-col gap-4 border-t border-black/10 bg-white px-4 py-4 md:hidden">${links}<hr class="border-black/10"><div class="flex flex-wrap items-center gap-3">${acct}</div></div>`;
}

/* ---------- pages ---------- */
const R = {};
const av = (u, c = "h-12 w-12") => u && isUrl(u) ? `<img src="${href(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" class="${c} shrink-0 rounded-full object-cover">` : `<div class="${c} shrink-0 rounded-full bg-saffron/25"></div>`;
const howHtml = `<div class="grid gap-px overflow-hidden rounded-2xl border border-black/10 bg-black/10 md:grid-cols-3">${[["Create your profile","Creators add their channels and rates. Brands describe their business."],["Post or apply","Brands publish campaigns. Creators apply with a proposal and a quoted price."],["Collaborate","Accepted applications become collaborations. Payments are handled outside the platform for now."]].map(([t, d], i) => `<div class="stag bg-white p-6"><p class="font-display text-6xl font-bold text-saffron/90">0${i + 1}</p><h3 class="mt-3 font-display text-xl">${t}</h3><p class="mt-1 text-sm text-ink/70">${d}</p></div>`).join("")}</div>`;

R["/"] = async () => {
  let cr = [], ca = [];
  try { cr = await rows("creatorProfiles", orderBy("subscribers", "desc"), limit(3)); ca = (await rows("campaigns", where("status", "==", "active"))).filter(c => !expired(c.deadline)).slice(0, 3); } catch {}
  const w = h => `<div class="mx-auto max-w-6xl px-4">${h}</div>`;
  const row = r => `<a href="#/creator?id=${E(r.id)}" class="flex items-center gap-3 rounded-xl bg-white/10 p-3 transition hover:bg-white/20">${av(r.photoUrl, "h-11 w-11")}<div class="min-w-0"><p class="truncate text-sm font-medium">${E(r.displayName)}</p><p class="truncate text-xs text-white/70">${E(r.category)}, ${E(r.language)}</p></div></a>`;
  return `${w(`<section class="relative isolate grid items-center gap-10 py-10 md:grid-cols-5 md:py-20">
    <div class="pat absolute inset-x-0 -top-6 -z-10 h-[125%]"></div>
    <div class="md:col-span-3"><p class="hero-in eyebrow" style="--d:0ms">Creators. Brands. Punjab.</p>
      <h1 class="hero-in mt-3 font-display text-5xl font-bold leading-[1.02] tracking-tight sm:text-6xl lg:text-7xl" style="--d:80ms">Where Punjabi creators meet <span class="text-saffron">great brands</span></h1>
      <p class="hero-in mt-6 max-w-lg text-lg text-ink/70" style="--d:200ms">Punjabi Connect links Punjabi YouTubers and Instagram creators with businesses looking for real collaborations. Create a profile, post a campaign, or apply in minutes.</p>
      <div class="hero-in mt-8 flex flex-wrap gap-3" style="--d:320ms"><a class="btn3 !px-6 !py-3" href="#/signup?role=creator">Join as Creator</a><a class="btn !px-6 !py-3" href="#/signup?role=brand">Join as Brand</a></div></div>
    <div class="hero-in md:col-span-2" style="--d:300ms"><div class="float relative overflow-hidden rounded-3xl bg-indigo p-5 text-white shadow-2xl"><div class="pat absolute inset-0 !opacity-20"></div><div class="relative space-y-3"><p class="eyebrow">Featured creators</p>${cr.length ? cr.map(row).join("") : `<div class="rounded-xl border border-dashed border-white/30 p-4 text-sm text-white/80">Real creator profiles appear here as soon as creators join.</div>`}<div class="flex flex-wrap gap-2 pt-1">${["YouTube", "Instagram", "Brand campaigns"].map(t => `<span class="rounded-full bg-white/10 px-2.5 py-0.5 text-xs">${t}</span>`).join("")}</div></div></div></div>
  </section>`)}
  <div class="phulkari"></div>
  ${w(`<section class="rv mt-14"><div class="flex items-end justify-between gap-3"><div><p class="eyebrow">Creators</p><h2 class="font-display text-3xl md:text-4xl">Featured Punjabi creators</h2></div><a class="lnk hidden text-sm sm:block" href="#/creators">See all</a></div><div class="mt-6 grid gap-4 md:grid-cols-3">${cr.length ? cr.map(creatorCard).join("") : `<div class="md:col-span-3">${empty("No creators yet. Be the first to join.")}</div>`}</div></section>
  <section class="rv mt-16"><div class="flex items-end justify-between gap-3"><div><p class="eyebrow">Campaigns</p><h2 class="font-display text-3xl md:text-4xl">Latest brand campaigns</h2></div><a class="lnk hidden text-sm sm:block" href="#/campaigns">See all</a></div><div class="mt-6 grid gap-4 md:grid-cols-3">${ca.length ? ca.map(campCard).join("") : `<div class="md:col-span-3">${empty("No active campaigns yet.")}</div>`}</div></section>
  <section class="rv mt-16"><p class="eyebrow">How it works</p><h2 class="mb-6 font-display text-3xl md:text-4xl">Three steps to a collaboration</h2>${howHtml}</section>`)}
  <section class="rv mt-16 bg-indigo py-14 text-white"><div class="mx-auto grid max-w-6xl gap-10 px-4 md:grid-cols-2"><div><p class="eyebrow">For creators</p><ul class="mt-3 space-y-2 text-white/85"><li>Get found by brands looking for Punjabi audiences</li><li>Choose campaigns that fit your niche and price</li><li>Track every application in one place</li></ul></div><div><p class="eyebrow">For brands</p><ul class="mt-3 space-y-2 text-white/85"><li>Reach Punjabi creators by category, language and location</li><li>Review proposals and quotes side by side</li><li>Approve content links before you close the work</li></ul></div></div></section>
  <section class="rv bg-saffron py-12 text-white"><div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4"><h2 class="font-display text-3xl">Ready to collaborate?</h2><div class="flex gap-3"><a class="btn2 !border-0" href="#/signup?role=creator">Join as Creator</a><a class="btn" href="#/signup?role=brand">Join as Brand</a></div></div></section>`;
};
R["/how"] = async () => wrap(`<h1 class="font-display text-3xl">How It Works</h1><div class="mt-6">${howHtml}</div>`);
for (const [k, t, b] of [["about", "About", "Punjabi Connect connects Punjabi creators with brands. Payments are currently handled outside the platform."], ["contact", "Contact", "Add your contact email or phone here."], ["privacy", "Privacy Policy", "Draft placeholder. Have a lawyer write the final policy before launch. We never show private emails publicly."], ["terms", "Terms", "Draft placeholder. Have a lawyer write final terms before launch."]])
  R["/" + k] = async () => wrap(`<h1 class="font-display text-3xl">${t}</h1><p class="mt-3 text-ink/70">${b}</p>`, "max-w-2xl");

function creatorCard(r) {
  return `<a href="#/creator?id=${E(r.id)}" class="card hov block"><div class="flex items-center gap-3">${av(r.photoUrl, "h-14 w-14")}<div class="min-w-0"><p class="truncate font-display text-lg leading-tight">${E(r.displayName)}${r.isDemo ? ' <span class="text-xs text-amber-700">DEMO</span>' : ""}</p><p class="truncate text-xs text-ink/60">${E(r.city)} ${E(r.state)}</p></div></div>
  <div class="mt-3 flex flex-wrap gap-1.5"><span class="chip">${E(r.category)}</span><span class="chip">${E(r.language)}</span>${r.youtubeUrl ? '<span class="chip">YouTube</span>' : ""}${r.instagramUrl ? '<span class="chip">Instagram</span>' : ""}</div>
  <div class="mt-4 grid grid-cols-3 gap-2 border-t border-black/10 pt-3 text-xs text-ink/60"><div><p class="text-sm font-semibold text-ink">${Number(r.subscribers || 0).toLocaleString("en-IN")}</p>audience</div><div><p class="text-sm font-semibold text-ink">${Number(r.avgViews || 0).toLocaleString("en-IN")}</p>avg views</div><div><p class="text-sm font-semibold text-saffron">${money(r.price)}</p>indicative</div></div></a>`;
}
function campCard(c) {
  const ex = expired(c.deadline);
  return `<a href="#/campaign?id=${E(c.id)}" class="card hov block"><p class="text-xs text-ink/60">${E(c.brandName)}${c.isDemo ? ' <span class="text-amber-700">DEMO</span>' : ""}</p><h3 class="mt-0.5 font-display text-lg leading-snug">${E(c.title)}</h3>
  <p class="mt-3 font-display text-3xl text-indigo">${money(c.budget)}</p><div class="mt-2 flex flex-wrap gap-1.5"><span class="chip">${E(c.contentType)}</span><span class="chip">${E(c.category)}</span></div>
  <p class="mt-3 text-sm text-ink/60">${E(c.location)} · <span class="${ex ? "text-red-600" : "font-medium text-ink"}">${ex ? "Closed " : "Apply by "}${fmtDate(c.deadline)}</span></p></a>`;
}

/* explore creators */
let CR = []; const CF = { category: "", language: "", platform: "", loc: "", aud: "", sort: "audience", n: 12 };
function creatorList() {
  const loc = CF.loc.toLowerCase();
  const l = CR.filter(r => (!CF.category || r.category === CF.category) && (!CF.language || r.language === CF.language) && (!CF.platform || (CF.platform === "YouTube" ? r.youtubeUrl : r.instagramUrl)) && (!loc || `${r.city} ${r.state}`.toLowerCase().includes(loc)) && (!CF.aud || (+r.subscribers || 0) >= Number(CF.aud)))
    .sort((a, b) => CF.sort === "price" ? (+a.price || 0) - (+b.price || 0) : CF.sort === "views" ? (+b.avgViews || 0) - (+a.avgViews || 0) : (+b.subscribers || 0) - (+a.subscribers || 0));
  if (!l.length) return empty("No creators match these filters yet.");
  return `<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${l.slice(0, CF.n).map(creatorCard).join("")}</div>${CF.n < l.length ? `<div class="mt-6 text-center"><button class="btn2" data-act="more">Load more</button></div>` : ""}`;
}
R["/creators"] = async () => {
  try { CR = await rows("creatorProfiles"); } catch { return wrap(empty("Could not load creators. Check your connection.")); }
  CF.n = 12;
  return wrap(`<h1 class="font-display text-3xl">Explore Creators</h1><p class="text-sm text-ink/60">All stats are self-reported by creators and are not verified.</p>

      await setDoc(doc(db, "users", c.user.uid), { role: d.role, email: d.email, displayName: d.name.trim(), status: "active", createdAt: serverTimestamp() });

  async forgot(d) { try { await sendPasswordResetEmail(auth, d.email); } catch {} toast("If that email is registered, a reset link is on its way."); },
  async apply(d, f) {

    catch { toast("Could not apply. You may have applied already.", false); }
  },
  async creatorProfile(d) {

    if (d.bio.length > 500) return bad("Bio must be under 500 characters.");

  },
  async brandProfile(d) {
    if (d.name.trim().length < 2) return bad("Enter your brand name.");
    for (const u of [d.logoUrl, d.website, d.social]) if (u && !isUrl(u)) return bad("Invalid link: " + u);
    try { await setDoc(doc(db, "brandProfiles", S.uid), { userId: S.uid, name: d.name.trim(), logoUrl: d.logoUrl, description: d.description, website: d.website, social: d.social, contactEmail: d.contactEmail, phone: d.phone, updatedAt: serverTimestamp() }, { merge: true }); toast("Profile saved."); } catch { toast("Could not save profile.", false); }
  },
  async campaign(d, f) {
    if (d.title.trim().length < 5) return bad("Title must be at least 5 characters.");
    if (d.description.trim().length < 20) return bad("Describe the product or service (20+ characters).");
    if (!(+d.budget > 0)) return bad("Enter a valid budget.");
    if (!d.deadline || new Date(d.deadline) < new Date(new Date().toDateString())) return bad("Pick a deadline in the future.");
    const data = { title: d.title.trim(), description: d.description.trim(), budget: +d.budget, category: d.category, minAudience: +d.minAudience || 0, language: d.language, location: d.location, contentType: d.contentType, deliverables: d.deliverables, deadline: d.deadline, requirements: d.requirements, updatedAt: serverTimestamp() };
    try {
      if (f.dataset.id) await updateDoc(doc(db, "campaigns", f.dataset.id), data);
      else { const bp = (await getDoc(doc(db, "brandProfiles", S.uid))).data(); await addDoc(collection(db, "campaigns"), { ...data, brandId: S.uid, brandName: bp?.name || S.user.displayName || "Brand", status: "draft", createdAt: serverTimestamp() }); }
      toast(f.dataset.id ? "Campaign updated." : "Saved as draft. Publish it when ready."); go("/dash?tab=campaigns"); route();
    } catch { toast("Could not save campaign.", false); }
  },
};
